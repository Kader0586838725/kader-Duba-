<!DOCTYPE html>

fc<méta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Météo Dubaï | projet 5 - kane kader</title>
<style>
body{
background: linear-gradient(135deg#0f172a, #1e293b);
color: white;
font-family: Arial, sans-serif;
text-align: center;
padding: 50px 20px;
}
.card{
background: rgba(255,255,255,0.1);
backdrop-filter: blur(10px);
border-radius: 20px;
padding: 30px;
max-width: 400px
margin: 0 auto;
border: 1px solid rgba(255,255,255,0.1);
}
h1{ color: #10b981; margin-bottom: 10px; }
h2{ font-size: 3rem; margin: 20px; }
button{
background:  #10b981; 
color: white;
border: none;
padding: 12px 25px;
border-radius: 10px;
font-size: 1rem;
cursor: pointer;
margin-top: 20px;
}
button:hover{ background: #059669; }

-top: 30px; color: #10b981; }
</style>
</head>
 <body>
<div class="card">
<h1>☀ Météo Dubaï </h1>
<p id="ville">Dubaï, Émirats Arabes Unis</p>
<h2 id="temp">--°C</h2>
<p id="dsec">Clique pour charger la météo </p>
<button onclick="getMeteo()">Actualiser</button>
<button id="refreshbtn">Actualiser</button> 
<a href="portfolio.html" class="back"> Retour Portfolio</a>
</div>
<script>
async function getMeteo(){ 
const url = 'https://api.open-meteo.com/v1/forecast?latitude=25.2048&longitude=55.2708&current_weather=true';
try{
const response = await fetch(url);
const data = await response.json();
const { temperature: temp, weathercode: code} = data.current_weather;

document.getElementById('temp').textContent = temp + '°C';

if (code ===0) document.getElementById('desc').textContent = 'Ciel dégagé ☀ ';
else if (code <= 3) document.getElementById('desc').textContent = 'Partiellement nuageux ⛅ ';
else document.getElementById('desc').textContent = 'Temps à Dubaï ';
} catch(erreur ){
document.getElementById('desc').textContent = 'Erreur API';
}
}
// charge auto au démarrage 
getMeteo();
 document.getElementById('refreshbtn').addEventListener('click', getMeteo);
</script>
</body>
<html>
